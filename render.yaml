services:
  - type: web
    name: magicpin-vera-bot
    runtime: python
    buildCommand: python -m pip install --upgrade pip && pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: MODEL_NAME
        value: deterministic-context-composer
      - key: SUBMITTED_AT
        sync: false
